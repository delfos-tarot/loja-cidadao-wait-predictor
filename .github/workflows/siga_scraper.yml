name: Poll live SIGA queue data

on:
  schedule:
    # ~08,10,12,14,16 UTC on weekdays ~= 09,11,13,15,17 WEST (Portugal summer
    # time) or 08,10,12,14,16 WET (winter) — spans opening/midday/afternoon
    # rather than one fixed hour, since real wait-time variance (not just
    # sample count) is what makes this data useful. See CLAUDE.md.
    #
    # Minute offset to :17 (not :00) is deliberate: found 2026-07-27 that
    # only 3 of 5 scheduled runs fired on day one, each 24-99 min late.
    # GitHub's own docs warn the top of every hour is the highest-congestion
    # time for the shared Actions scheduler (every repo with an on-the-hour
    # cron collides there), and scheduled runs can be delayed or dropped
    # under that load. Offsetting away from :00 doesn't guarantee on-time
    # firing, but avoids the specific congestion peak GitHub calls out.
    - cron: "17 8,10,12,14,16 * * 1-5"
  workflow_dispatch: {} # allow manual triggering from the GitHub Actions UI

permissions:
  contents: write # the default GITHUB_TOKEN is read-only otherwise; needed to push data/live_samples.csv back
  issues: write # needed to auto-file an issue if a run fails, so failures are visible without relying on email

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll live SIGA data
        run: python -m scrapers.siga_scraper --once --csv-out data/live_samples.csv

      - name: Commit and push new samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live_samples.csv
          git diff --cached --quiet && echo "No new rows" || git commit -m "Live SIGA samples $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      # Runs only if any prior step failed. Files (or reuses) one open issue
      # rather than a fresh one per failure, so repeated failures don't spam
      # the repo -- this is the durable, hard-to-miss signal for "come back
      # in weeks and check" cadences, since email notifications are easy to
      # miss or have disabled.
      - name: File an issue if this run failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --label scraper-failure --state open --json number --jq '.[0].number')
          BODY="Run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) failed at $(date -u +%Y-%m-%dT%H:%M:%SZ). Check the SIGA site hasn't changed shape (see pipeline/siga_client.py's docstring for what 'working' looks like)."
          if [ -z "$EXISTING" ]; then
            gh issue create --repo "${{ github.repository }}" --title "Scraper workflow failing" --label scraper-failure --body "$BODY"
          else
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          fi
