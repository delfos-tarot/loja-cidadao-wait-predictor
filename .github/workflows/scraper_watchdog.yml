name: Scraper watchdog

on:
  schedule:
    # Every 15 min, Mon-Sat business hours -- deliberately much more
    # frequent than siga_scraper.yml's own 2-hour slots. GitHub's own docs
    # say the `schedule` trigger can be delayed *or silently dropped* under
    # high load, with no error to catch (see siga_scraper.yml's comments and
    # CLAUDE.md -- found 2026-07-28 that 2 consecutive real slots didn't
    # fire at all, not just late). Running this watchdog on its own separate
    # 15-min schedule means many more independent chances for at least one
    # tick to get through and notice the gap, rather than hoping a handful
    # of fixed-time crons individually dodge the same congestion window.
    #
    # Saturday (day 6) added 2026-07-28: cleaned_historical_baseline.parquet
    # shows real, nonzero Saturday attendance (~672K vs Sunday's exactly 0)
    # -- Sunday intentionally excluded since there's no evidence branches
    # are ever open then.
    - cron: "*/15 7-17 * * 1-6"
  workflow_dispatch: {}

permissions:
  actions: write # needed to list/dispatch runs of siga_scraper.yml
  issues: write # needed to raise a collection-stalled alert (see the last step)

jobs:
  check-and-backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch siga_scraper if it hasn't run recently
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Newest run of any status/event for the target workflow.
          LATEST_JSON=$(gh run list --repo "$REPO" --workflow siga_scraper.yml \
            --limit 1 --json status,createdAt)
          LATEST_STATUS=$(echo "$LATEST_JSON" | jq -r '.[0].status // empty')
          LATEST_CREATED=$(echo "$LATEST_JSON" | jq -r '.[0].createdAt // empty')

          if [ "$LATEST_STATUS" = "in_progress" ] || [ "$LATEST_STATUS" = "queued" ]; then
            echo "A run is already $LATEST_STATUS, nothing to do."
            exit 0
          fi

          if [ -z "$LATEST_CREATED" ]; then
            echo "No prior runs found at all -- dispatching."
          else
            LATEST_EPOCH=$(date -d "$LATEST_CREATED" +%s)
            NOW_EPOCH=$(date -u +%s)
            AGE_MIN=$(( (NOW_EPOCH - LATEST_EPOCH) / 60 ))
            echo "Last run started $AGE_MIN min ago (at $LATEST_CREATED)."

            # Lowered from 100 to 20 min on 2026-07-28: with the push-race
            # and CSV-corruption bugs both fixed the same day, there's no
            # longer a reason to hold back -- coverage_report.py showed 0
            # (branch, service) combos with >=30 real usable samples after
            # 12 sweeps in ~42h at the old ~5-sweeps/weekday cadence (median
            # combo projected ~7 weeks out). This turns the watchdog from a
            # backstop into the primary driver, converging toward the
            # scraper's own originally-designed POLL_INTERVAL_SECONDS
            # (15 min) continuous-loop cadence rather than an arbitrary
            # escalation -- roughly a 4-6x increase in sweeps/day.
            if [ "$AGE_MIN" -lt 20 ]; then
              echo "Recent enough, nothing to do."
              exit 0
            fi
          fi

          echo "No recent run -- dispatching siga_scraper.yml now."
          gh workflow run siga_scraper.yml --repo "$REPO"

      # Deliberately `if: always()` and internally `|| true`: this step is
      # pure alerting and must never be able to fail the run or interfere
      # with the dispatch above -- collecting data matters more than
      # reporting on it.
      #
      # Added 2026-07-30 to close a real gap: data collection is driven by
      # an EXTERNAL cron (cron-job.org calling this workflow's
      # workflow_dispatch), because GitHub's own `schedule:` trigger proved
      # unreliable -- see siga_scraper.yml's comments. Nothing alerted when
      # that external trigger went silent for ~2 hours on 2026-07-29; it
      # was noticed by chance. This step is the safety net for exactly
      # that, and it works even if the external trigger is the thing that
      # died, because this workflow's own (unreliable but non-zero)
      # `schedule:` trigger still fires it eventually -- late is far better
      # than never.
      #
      # Threshold is generous (3h) relative to the ~20-30 min steady-state
      # cadence: this alerts on "collection has genuinely stalled", not on
      # the ordinary late tick the dispatch logic above already handles.
      # Reuses siga_scraper.yml's one-open-issue-per-problem pattern so a
      # multi-hour outage comments on a single issue instead of filing one
      # per tick.
      - name: Alert if data collection has stalled
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          STALL_THRESHOLD_MIN=180

          LATEST_CREATED=$(gh run list --repo "$REPO" --workflow siga_scraper.yml \
            --limit 1 --json createdAt --jq '.[0].createdAt // empty') || true
          if [ -z "${LATEST_CREATED:-}" ]; then
            echo "Could not determine the last run time; skipping alert check."
            exit 0
          fi

          AGE_MIN=$(( ( $(date -u +%s) - $(date -d "$LATEST_CREATED" +%s) ) / 60 ))
          echo "Last siga_scraper run started $AGE_MIN min ago."
          if [ "$AGE_MIN" -lt "$STALL_THRESHOLD_MIN" ]; then
            exit 0
          fi

          gh label create collection-stalled --repo "$REPO" \
            --color D93F0B --description "No siga_scraper run completed recently" 2>/dev/null || true

          BODY="No \`siga_scraper.yml\` run has started in **$AGE_MIN minutes** (last: $LATEST_CREATED). Expected cadence is ~20-30 min during business hours. Most likely cause: the external cron (cron-job.org) that dispatches \`scraper_watchdog.yml\` has stopped firing — check its execution history and that its GitHub token is still valid (it 401'd once on 2026-07-29 when the auth header didn't save)."

          EXISTING=$(gh issue list --repo "$REPO" --label collection-stalled --state open --json number --jq '.[0].number') || true
          if [ -z "${EXISTING:-}" ]; then
            gh issue create --repo "$REPO" --title "Live data collection has stalled" \
              --label collection-stalled --body "$BODY" || true
          else
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY" || true
          fi
